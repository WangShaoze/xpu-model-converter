# YOLOv7 实例分割模型配置(ISegment 头: det+掩膜系数 + proto 双输出)
model_type: yolov7-seg
framework: pytorch
task: segment

input_shape: [1, 3, 640, 640]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 80
class_names: []

opset: 13
# 输出为 [det+coeff bnc (B, N, 117: 85 检测 + 32 掩膜系数), proto (B,32,160,160)], NMS/掩膜在 CPU 侧完成
end2end: false
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: true
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.3
  iou_thres: 0.45