# YOLOv8 pose 关键点模型配置(COCO-pose, 单类 person + 17 关键点)
model_type: yolov8-pose
framework: pytorch
task: pose

input_shape: [1, 3, 640, 640]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 1
class_names: ["person"]

opset: 13
# 输出为 det 分支(4+1+51 通道, bcn) + NMS 在 CPU 侧完成
end2end: false
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: true
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.25
  iou_thres: 0.45