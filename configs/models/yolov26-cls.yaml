# YOLO26 分类模型配置
model_type: yolov26-cls
framework: pytorch
task: cls
input_shape: [1, 3, 224, 224]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 1000
class_names: []

opset: 13
# 分类输出为类别概率向量, 无框
end2end: false
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: false
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.25
  iou_thres: 0.45
