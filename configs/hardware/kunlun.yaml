# 昆仑芯 XPU 硬件能力配置(建设目标 V1 目标硬件)
# 说明: sdk_adapter=auto 按优先级自动探测; 在拿到昆仑 SDK 型号/版本信息前会降级为
#       stub(占位产物), 详见 backend/kunlun/compiler.py。
#       base_image / packages / minio / kafka 等**部署环境**配置见
#       configs/deployment/kunlun_docker.yaml(ChatGPT 修改意见 §26/§27)。
name: kunlun
# auto | paddle | xpuctl | stub
sdk_adapter: auto
# sdk_adapter=xpuctl 时的模块名(留空则按 xpu_toolkit/xtcl/xpu_inference 自动探测)
sdk_module: ""
# 昆仑芯型号: auto | R200 | R300 ...
target_chip: auto
# fp32 | fp16
precision: fp16
# auto | xpu | cpu
device: auto
optimization_level: 2

extra: {}
