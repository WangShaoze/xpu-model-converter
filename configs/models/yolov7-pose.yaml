# YOLOv7 pose 关键点模型配置(COCO-pose, 单类 person + 17 关键点, IKeypoint 头)
model_type: yolov7-pose
framework: pytorch
task: pose

input_shape: [1, 3, 1280, 1280]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 1
class_names: ["person"]

opset: 13
# IKeypoint 单独输出 concat 主张量 [1, N, 4+(1+nc)+3K](bnc, 带 objectness), NMS 在 CPU 侧完成
end2end: false
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: true
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.25
  iou_thres: 0.45