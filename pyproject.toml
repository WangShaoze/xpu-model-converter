[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-model-converter"
version = "1.0.0"
description = "模型转换平台: PyTorch/Paddle -> ONNX -> 昆仑芯 XPU -> Docker 交付包"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "xpu-model-converter" }]
dependencies = [
    "numpy>=1.21",
    "PyYAML>=5.4",
    "Jinja2>=3.0",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
onnx = ["onnx>=1.12", "onnxruntime>=1.13"]
paddle = ["paddlepaddle>=2.5"]
storage = ["minio>=7.2"]
db = ["sqlalchemy>=2.0", "alembic>=1.12", "psycopg2-binary>=2.9"]
queue = ["redis>=5.0"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
]
dev = ["pytest"]

[project.scripts]
xpu-converter = "xpu_converter.cli.main:main"
xpu-worker = "xpu_platform.worker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["xpu_converter*", "xpu_platform*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.yaml", "*.json", "*.sh"]
