# YOLOv10 检测模型配置(V1 主线路)
model_type: yolov10
framework: pytorch
task: detection

input_shape: [1, 3, 640, 640]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 80
# 留空时自动使用 COCO 80 类
class_names: []

opset: 13
# YOLOv10 原生带 NMS 头(end2end); V1 约定剥离 NMS, 交由 CPU 侧完成(建设目标 §17)
end2end: false
# auto | end2end | columns
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: true
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.25
  iou_thres: 0.45
