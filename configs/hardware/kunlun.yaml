# 昆仑芯 XPU 后端配置(建设目标 V1 目标硬件)
# 说明: base_image 与客户现场服务器保持一致; sdk_adapter=auto 按优先级自动探测,
#       在拿到昆仑 SDK 型号/版本信息前会降级为 stub(占位产物), 详见 backend/kunlun/compiler.py
name: kunlun
base_image: iregistry.baidu-int.com/ai-station/kunlun2-paddlepaddle_2_6_1-py310-cv:v20260121
# auto | paddle | xpuctl | stub
sdk_adapter: auto
# sdk_adapter=xpuctl 时的模块名(留空则按 xpu_toolkit/xtcl/xpu_inference 自动探测)
sdk_module: ""
# 昆仑芯型号: auto | R200 | R300 ...
target_chip: auto
# fp32 | fp16
precision: fp16
# auto | xpu | cpu
device: auto
optimization_level: 2

runtime:
  api_version: v1
  type: detection
  port: 58025
  workers: 1
  conf_thres: 0.25
  iou_thres: 0.45

docker:
  template: kunlun
  include_packages: true
  include_paddle: true
  # 本地依赖轮子目录: 不为空时把其中的 .whl/.tar.gz/.zip 复制进交付包 packages/,
  # 供 Dockerfile 内 `pip install /tmp/packages/*.whl --no-deps` 使用。
  # 参考集合: Flask / Werkzeug / Jinja2 / click / itsdangerous / gunicorn /
  #          minio / kafka_python / urllib3 / certifi / pytz / Cython
  #          onnxruntime(降级占位产物走仿真加载必需, 基础镜像不含)
  packages_dir: "vendor/wheels"
  # 日志上报(minio/kafka)默认地址, 客户现场可用 docker run -e 覆盖
  log:
    minio_host: "128.128.0.1"
    minio_port: "9000"
    minio_bucket: "alg-log"
    minio_access_key: "minioadmin"
    minio_secret_key: "minioadmin123"
    kafka_host: "128.128.0.1"
    kafka_port: "9092"
    kafka_topic: "alg-log"

extra: {}
