# YOLO26 深度估计模型配置
model_type: yolov26-depth
framework: pytorch
task: depth
input_shape: [1, 3, 640, 640]
input_dtype: float32
input_layout: NCHW
dynamic: false

num_classes: 1
class_names: []

opset: 13
# 逐像素深度图输出
end2end: false
output_layout: auto

preprocess:
  color: RGB
  scale: 0.00392156862745098
  letterbox: true
  letterbox_scale_up: false
  pad_value: 114

postprocess:
  nms: cpu
  max_det: 300
  conf_thres: 0.25
  iou_thres: 0.45
